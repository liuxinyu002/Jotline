name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取 package.json packageManager（pnpm 12.4.1）

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 安装依赖（按 lockfile 冻结）
        run: pnpm install --frozen-lockfile

      - name: 生成契约产物（build）
        run: pnpm contracts:build

      - name: 零漂移 + Wire 纪律检查（check）
        run: pnpm contracts:check

      - name: Mock 冒烟（起服务 + 四条 curl 断言）
        run: |
          pnpm --filter @jotline/mock run start &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null "$BASE" 2>/dev/null; then break; fi
            sleep 1
          done
          bash scripts/mock-smoke.sh
        env:
          BASE: http://127.0.0.1:4766

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy（全 workspace 零告警门禁，含 server）
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: 单元测试（全 workspace，含 server in-process 测试）
        run: cargo test --workspace --locked

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 安装依赖（按 lockfile 冻结）
        run: pnpm install --frozen-lockfile

      - name: Biome 检查（app / sidecar / mock）
        run: pnpm lint

      - name: 类型检查（含契约类型消费侧）
        run: pnpm typecheck
